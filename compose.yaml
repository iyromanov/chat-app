services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      target: api
    environment:
      MONGODB_URI: mongodb://mongo:27017/chat
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      PORT: 3001
      COOKIE_SECURE: 'false'
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    environment:
      ORIGIN: http://localhost:8080
  proxy:
    image: nginx:1.28-alpine
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
volumes:
  mongo-data:
